---
substitutions:
  name: cores3-va-e39e44
  friendly_name: M5Stack CoreS3 Voice Assistant e39e4

  # Ctrlable expression set. Rendered from ctrlable_logo_expressions/*.svg to
  # 320x240 PNG with a TRANSPARENT ground and the art scaled to 190px tall --
  # the thinking and replying pages overlay white text boxes at y=20..50 and
  # y=190..220, so full-height art would be partly covered by them.
  # Served from the public repo, the same way upstream references the Casita
  # set -- so a rebuild needs no files in the ESPHome config directory and the
  # HAOS VM never has to be touched. For an offline build, drop the PNGs in
  # <esphome config dir>/images/ and change these back to images/<name>.png.
  loading_illustration_file: https://raw.githubusercontent.com/Ctrlable/ha-ctrlable-snapcast-tts/main/esphome/images/ctrlable_loading.png
  idle_illustration_file: https://raw.githubusercontent.com/Ctrlable/ha-ctrlable-snapcast-tts/main/esphome/images/ctrlable_idle.png
  listening_illustration_file: https://raw.githubusercontent.com/Ctrlable/ha-ctrlable-snapcast-tts/main/esphome/images/ctrlable_listening.png
  thinking_illustration_file: https://raw.githubusercontent.com/Ctrlable/ha-ctrlable-snapcast-tts/main/esphome/images/ctrlable_thinking.png
  replying_illustration_file: https://raw.githubusercontent.com/Ctrlable/ha-ctrlable-snapcast-tts/main/esphome/images/ctrlable_replying.png
  error_illustration_file: https://raw.githubusercontent.com/Ctrlable/ha-ctrlable-snapcast-tts/main/esphome/images/ctrlable_alert.png
  error_no_wifi_illustration_file: https://raw.githubusercontent.com/Ctrlable/ha-ctrlable-snapcast-tts/main/esphome/images/ctrlable_no_wifi.png
  error_no_ha_illustration_file: https://raw.githubusercontent.com/Ctrlable/ha-ctrlable-snapcast-tts/main/esphome/images/ctrlable_no_ha_file.png
  mute_illustration_file: https://raw.githubusercontent.com/Ctrlable/ha-ctrlable-snapcast-tts/main/esphome/images/ctrlable_mute.png
  # Shown for the instant between the wake word and the mic opening, so the
  # face reacts before it starts listening instead of after.
  awake_illustration_file: https://raw.githubusercontent.com/Ctrlable/ha-ctrlable-snapcast-tts/main/esphome/images/ctrlable_awake.png

  # Fonts
  mdi_webfont_file: https://raw.githubusercontent.com/Templarian/MaterialDesign-Webfont/master/fonts/materialdesignicons-webfont.ttf

  # No local audio files. Every sound this device makes comes out of the room's
  # snapclient via the add-on's bundled chimes -- which are the LVA satellites'
  # own awake.wav and done.wav, so the whole house answers in one voice.

  # How long to hold the mic closed after the wake word.
  #
  # Was 1500ms, which made the device feel dead -- you would start talking to the
  # awake face before it was listening. That number existed to outlast
  # snapserver's 1000ms buffer; the announcement instance now runs at 200ms
  # (buffer = 200 in /etc/snapserver-announcement.conf on LXC 113), so the chime
  # is audible ~0.45s after the wake word instead of ~1.5s and the long wait no
  # longer buys anything.
  #
  # 250ms is essentially "immediately" -- just enough for the awake frame to
  # paint. The chime now lands just AFTER the mic opens rather than before it,
  # which is how every commercial assistant behaves. If chime artefacts start
  # showing up at the start of transcriptions, raise this to ~700ms and the
  # chime will finish before the mic opens again.
  chime_lead_in: 250ms

  # Blank the screen after this long at rest. Touch or a wake word brings it
  # back. Only ever sleeps from idle/muted -- never mid-conversation.
  screen_timeout: 25s

  # Micro wake word models.
  #
  # There is no "maya" model. The complete published set is okay_nabu,
  # hey_jarvis, hey_mycroft and alexa (esphome/micro-wake-word-models v2), plus
  # four experiments -- okay_computer, hey_home_assistant, hey_peppa_pig,
  # choo_choo_homie. A custom word has to be trained; see the note in the models
  # list below.
  #
  # COST OF ADDING MORE: every model runs inference on every audio frame, all
  # the time. Flash and PSRAM are not the constraint here, CPU is. If the device
  # starts stuttering or missing wake words, remove models rather than lowering
  # sensitivity.
  okay_nabu_model_file: https://github.com/kahrendt/microWakeWord/releases/download/okay_nabu_20241226.3/okay_nabu.json
  stop_model_file: https://github.com/kahrendt/microWakeWord/releases/download/stop/stop.json
  okay_computer_model_file: https://github.com/esphome/micro-wake-word-models/raw/main/models/v2/experiments/okay_computer.json
  hey_home_assistant_model_file: https://github.com/esphome/micro-wake-word-models/raw/main/models/v2/experiments/hey_home_assistant.json

  loading_illustration_background_color: '000000'
  idle_illustration_background_color: '000000'
  listening_illustration_background_color: '000000'
  thinking_illustration_background_color: '000000'
  replying_illustration_background_color: '000000'
  error_illustration_background_color: '000000'
  awake_illustration_background_color: '000000'

  # Phases of the Voice Assistant
  # The voice assistant is ready to be triggered by a wake word
  voice_assist_idle_phase_id: "1"
  # The voice assistant is listening for a voice command
  voice_assist_listening_phase_id: "2"
  # The voice assistant is currently processing the command
  voice_assist_thinking_phase_id: "3"
  # The voice assistant is replying to the command
  voice_assist_replying_phase_id: "4"
  # The wake word just fired; the mic is not open yet
  voice_assist_awake_phase_id: "5"
  # The voice assistant is not ready
  voice_assist_not_ready_phase_id: "10"
  # The voice assistant encountered an error
  voice_assist_error_phase_id: "11"
  # Muted phase
  voice_assist_muted_phase_id: "12"


  # --- Ctrlable Snapcast routing -------------------------------------------
  # satellite_id sent to the add-on. MUST match a mapping registered at
  # POST /mappings, or every announce returns 404 "Satellite has no mapping".
  #
  # This is NOT the ESPHome device name. It is the slug of the HA
  # assist_satellite entity the device registers as, which HA derives from the
  # FRIENDLY name -- "M5Stack CoreS3 Voice Assistant" + the mac suffix -- and
  # then suffixes with "-assist-satellite". Verified against the live add-on:
  #   GET /mappings -> m5stack-cores3-voice-assistant-e39e44-assist-satellite
  # Same shape as the LVA satellites (lva-family-room-assist-satellite).
  snapcast_satellite_id: m5stack-cores3-voice-assistant-e39e44-assist-satellite
  # Completion signal. The integration holds this ON for exactly the span of the
  # announce, and the add-on only returns once playback has finished -- so its
  # ON->OFF edge is the real end-of-playback moment. Entity id is derived from
  # the satellite_id by HA's slugify.
  snapcast_announcing_entity: binary_sensor.m5stack_cores3_voice_assistant_e39e44_assist_satellite_announcing
  # Backstop only, for when HA is unreachable or the entity does not exist yet
  # (older integration build). Never the normal path.
  announce_max_wait: 25s

  # Add support for non-unicode characters by using better glyphs
  font_glyphsets: "GF_Latin_Core"
  # for Greek use "Noto Sans" for other languages use a compatible font family
  font_family: Figtree

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  min_version: 2026.1.0
  name_add_mac_suffix: false
  on_boot:
    - priority: 600
      then:
        - light.turn_on:
            id: lcd_backlight
            brightness: 80%
    - priority: 100
      then:
        - delay: 200ms
        - script.execute: draw_display
        - delay: 30s
        - if:
            condition:
              lambda: return id(init_in_progress);
            then:
              - lambda: id(init_in_progress) = false;
              - script.execute: draw_display


esp32:
  variant: esp32s3
  flash_size: 16MB
  cpu_frequency: 240MHz
  framework:
    type: esp-idf
    ## Note: Disable these configurations if you face the boot loop issue.
    sdkconfig_options:
        CONFIG_ESP32S3_DATA_CACHE_64KB: "y"
        CONFIG_ESP32S3_DATA_CACHE_LINE_64B: "y"
        CONFIG_ESP32S3_INSTRUCTION_CACHE_32KB: "y"

        # Moves instructions and read only data from flash into PSRAM on boot.
        # Both enabled allows instructions to execute while a flash operation is in progress without needing to be placed in IRAM.
        # Considerably speeds up mWW at the cost of using more PSRAM.
        CONFIG_SPIRAM_RODATA: "y"
        CONFIG_SPIRAM_FETCH_INSTRUCTIONS: "y"

        CONFIG_BT_ALLOCATION_FROM_SPIRAM_FIRST: "y"
        CONFIG_BT_BLE_DYNAMIC_ENV_MEMORY: "y"

        CONFIG_MBEDTLS_EXTERNAL_MEM_ALLOC: "y"
        CONFIG_MBEDTLS_SSL_PROTO_TLS1_3: "y"  # TLS1.3 support isn't enabled by default in IDF 5.1.5

psram:
  mode: quad
  speed: 80MHz

# Enable Home Assistant API
api:
  encryption:
    key: /5jWV/v8fsARJGhs5Hy9VyD5Ljm1rCFm48elbU56bbc=

  on_client_connected:
    - script.execute: draw_display
  on_client_disconnected:
    - script.execute: draw_display



ota:
  - platform: esphome
    id: ota_esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
  on_connect:
    - script.execute: draw_display
  on_disconnect:
    - script.execute: draw_display      

captive_portal:

# Enable logging
logger:
  level: DEBUG

globals:
  - id: init_in_progress
    type: bool
    restore_value: no
    initial_value: "true"
  - id: voice_assistant_phase
    type: int
    restore_value: no
    initial_value: ${voice_assist_not_ready_phase_id}
  # --- Ctrlable Snapcast routing ---
  # True while the answer is playing through Snapcast. on_end must not return
  # the device to idle while this is set -- that is the stuck-state bug.
  - id: responding
    type: bool
    restore_value: no
    initial_value: "false"
  # Volume to put back after the silent local playback. Seeded to the observed
  # default so the very first restore cannot land on zero.
  # on_intent_progress and on_tts_end can carry the same URL for one exchange;
  # announcing twice plays the answer twice in the room.
  - id: last_tts_url
    type: std::string
    restore_value: no
    initial_value: '""'
  - id: current_wake_word
    type: std::string
    restore_value: no
    initial_value: '""'

i2s_audio:
  - id: i2s_audio_bus
    i2s_lrclk_pin: GPIO33
    i2s_bclk_pin: GPIO34
    i2s_mclk_pin:
      number: GPIO0
      ignore_strapping_warning: true

  # --- Ctrlable Snapcast routing: the silent sink -------------------------
  #
  # A second I2S controller (the S3 has two) wired to pins with nothing on the
  # other end. The announcement pipeline plays into this, which buys two things
  # that were previously mutually exclusive:
  #
  #   1. HA's assist_satellite leaves `responding`. That state is cleared by an
  #      announcement-finished report, which ESPHome only sends when
  #      voice_assistant owns a media_player. Before this, choosing silence meant
  #      the entity sat in `responding` forever -- confirmed 2026-08-09, entity
  #      last_changed pinned to the previous exchange's TTS start.
  #   2. It is genuinely inaudible. Not muted -- muting the announcement pipeline
  #      does not work (measured: "PLAYING / Muted: YES" then full-volume audio)
  #      and the aw88298's set_mute_off() is a no-op that strands the DAC. The
  #      bits are simply clocked out to unconnected pads.
  #
  # It also fixes something unrelated and long-standing: the mic and the real
  # speaker shared one bus, so every wake word logged
  #     [E][i2s_audio.speaker.std] Parent bus is busy
  #     [E][i2s_audio.speaker] Driver failed to start; retrying in 1 second
  # and lost a second to the retry. Separate controllers, no contention.
  #
  # PIN CHOICE: Port B (G8/G9) and Port C (G17). Grove headers, so they are
  # guaranteed not to be internally wired to anything on the CoreS3 -- unlike the
  # free-looking GPIOs in the 5-21 range, several of which land on the camera.
  # DO NOT plug a Grove device into Port B or Port C on this unit.
  - id: i2s_null_bus
    i2s_lrclk_pin: GPIO9
    i2s_bclk_pin: GPIO8

i2c:
  - id: bsp_bus
    sda: GPIO12
    scl: GPIO11
  - id: ext_bus
    sda: GPIO2
    scl: GPIO1
    scan: true

spi:
  - id: spi_bus
    clk_pin: GPIO36
    mosi_pin: GPIO37

external_components:
  - source: github://m5stack/esphome-yaml/components
    components: [axp2101, aw88298, aw9523b ]
    refresh: 0s


# PMU
sensor:
  - platform: axp2101
    id: axp2101_sensor
    battery_level:
      name: "Battery Level"
    battery_voltage:
      name: "Battery Voltage"
    axp_temperature:
      name: "AXP2101 Temperature"
    battery_charging:
      name: "Battery Charging"
    
axp2101:
  id: axp2101_pmu
  i2c_id: bsp_bus

# IO Expander
aw9523b:
  id: aw9523b_hub
  i2c_id: bsp_bus
  p0_drive_mode: PUSH_PULL

output:
  - platform: axp2101
    type: range
    channel: DLDO1
    id: lcd_backlight_output
    min_voltage: 2600
    max_voltage: 3300

  - platform: axp2101
    channel: ALDO1
    voltage: 1800

  - platform: axp2101
    channel: ALDO2
    voltage: 3300
  
  - platform: axp2101
    channel: BLDO1
    voltage: 2800
  
  - platform: axp2101
    channel: BLDO2
    voltage: 1500

light:
  - platform: monochromatic
    id: lcd_backlight
    name: "LCD Backlight"
    icon: "mdi:television"
    output: lcd_backlight_output
    restore_mode: RESTORE_DEFAULT_ON
    default_transition_length: 250ms

# some aw9523b inputs (handle interrupts)
# and other binary sensors
binary_sensor:
  - platform: gpio
    name: "ES_INT P0_3"
    pin:
      aw9523b_id: aw9523b_hub
      number: 3
    on_press:
      then:
        - logger.log: "ES7210 interrupt triggered"
    internal: true

  - platform: gpio
    name: "TF_SW P0_4"
    pin:
      aw9523b_id: aw9523b_hub
      number: 4 
    on_press:
      then:
        - logger.log: "TF_SW interrupt triggered"
    internal: true
  
  - platform: gpio
    name: "TOUCH_INT P1_2"
    pin:
      aw9523b_id: aw9523b_hub
      number: 10
    on_press:
      then:
        - logger.log: "TOUCH interrupt triggered"
    internal: true

  - platform: gpio
    name: "AW_INT P1_3"
    pin:
      aw9523b_id: aw9523b_hub
      number: 11
    on_press:
      then:
        - logger.log: "AW88298 interrupt triggered"
    internal: true

  # --- Ctrlable Snapcast routing ---
  # Mirrors the integration's per-satellite announcing sensor. ESPHome cannot
  # subscribe to HA events, only entity state, which is why the integration
  # exposes this as an entity rather than relying on its EVENT_ANNOUNCED.
  - platform: homeassistant
    id: snapcast_announcing
    entity_id: ${snapcast_announcing_entity}
    internal: true
    on_release:
      # ON -> OFF means the room has stopped talking. Guarded because this also
      # fires when the entity first reports its (off) state at startup.
      - if:
          condition:
            lambda: return id(responding);
          then:
            - script.execute: finish_response

audio_adc:
  - platform: es7210
    id: es7210_adc
    i2c_id: bsp_bus
    bits_per_sample: 16bit
    sample_rate: 16000
    mic_gain: 36

audio_dac:
  - platform: aw88298
    id: aw88298_dac
    i2c_id: bsp_bus
    sample_rate: 48000

microphone:
  - platform: i2s_audio
    id: i2s_mic
    i2s_din_pin: GPIO14
    adc_type: external
    sample_rate: 16000
    bits_per_sample: 16bit 
    i2s_audio_id: i2s_audio_bus

speaker:
  # The real speaker. Still defined -- deleting it would orphan the aw88298 and
  # make going back to local audio a rewrite rather than a one-line change -- but
  # nothing routes to it any more.
  - platform: i2s_audio
    i2s_audio_id: i2s_audio_bus
    id: i2s_speaker
    dac_type: external
    i2s_dout_pin: GPIO13
    audio_dac: aw88298_dac

  # --- Ctrlable Snapcast routing: the silent sink -------------------------
  # No audio_dac: there is no DAC on the far end, and that is the point.
  - platform: i2s_audio
    i2s_audio_id: i2s_null_bus
    id: null_speaker
    dac_type: external
    i2s_dout_pin: GPIO17

media_player:
  - platform: speaker
    name: None
    id: va_media_player
    # These no longer gate audibility -- the pipeline below goes nowhere, so
    # local output is silent at any setting. The slider now has a different job:
    # announce_and_wait forwards its 0-1 value to the add-on as a 0-100 snapclient
    # volume, so this control governs how loud the reply is IN THE ROOM. Kept at
    # full range for that reason.
    volume_min: 0.0
    volume_max: 1.0
    announcement_pipeline:
      # Silent sink -- see the i2s_null_bus comment. Everything audible leaves
      # this device over the network, not over I2S.
      speaker: null_speaker
      format: FLAC
      sample_rate: 48000
      num_channels: 1
    on_announcement:
      # Stop the wake word (mWW or VA) if the mic is capturing
      - if:
          condition:
            - microphone.is_capturing:
          then:
            - script.execute: stop_wake_word
            # Ensure VA stops before moving on
            - if:
                condition:
                  - lambda: |-
                      return id(wake_word_engine_location).current_option() == "In Home Assistant";
                then:
                  - wait_until:
                      - not:
                          voice_assistant.is_running:
      # Since VA isn't running, this is user-initiated media playback. Draw the mute display
      #
      # `responding` guard is Ctrlable's. VA goes IDLE at tts_start, so during a
      # Snapcast-routed reply the silent local copy looks exactly like
      # user-initiated playback and would repaint the screen to the mute face
      # for the length of the answer.
      - if:
          condition:
            and:
              - not:
                  voice_assistant.is_running:
              - lambda: return !id(responding);
          then:
            - lambda: id(voice_assistant_phase) = ${voice_assist_muted_phase_id};
            - script.execute: draw_display
    on_idle:
      # Since VA isn't running, this is the end of user-initiated media playback. Restart the wake word.
      # `responding` guard is Ctrlable's: see above.
      - if:
          condition:
            and:
              - not:
                  voice_assistant.is_running:
              - lambda: return !id(responding);
          then:
            - script.execute: start_wake_word
            - script.execute: set_idle_or_mute_phase
            - script.execute: draw_display

micro_wake_word:
  id: mww
  microphone: i2s_mic
  stop_after_detection: false
  models:
    - model: ${okay_nabu_model_file}
      id: okay_nabu
    - model: hey_jarvis
      id: hey_jarvis
    - model: hey_mycroft
      id: hey_mycroft
    - model: alexa
      id: alexa
    - model: ${okay_computer_model_file}
      id: okay_computer
    - model: ${hey_home_assistant_model_file}
      id: hey_home_assistant
    # To add a custom word ("maya"), train it with the microWakeWord notebook at
    # github.com/kahrendt/microWakeWord, publish the .json + .tflite pair
    # somewhere reachable at build time, and add it here the same way as the two
    # experiment models above.
    - model: ${stop_model_file}
      id: stop
      internal: true
  vad:
  on_wake_word_detected:
    # --- Ctrlable Snapcast routing ---
    # Remember which model fired: the add-on can map wake-word -> target zone,
    # so an announce with an empty wake_word only matches a "*" mapping.
    - lambda: id(current_wake_word) = wake_word;

    # React on screen FIRST, before anything that can block. The face changing
    # is the fastest feedback available -- it beats the chime to the room by
    # about a second.
    - lambda: id(voice_assistant_phase) = ${voice_assist_awake_phase_id};
    - script.execute: draw_display

    # --- Ctrlable Snapcast routing ---
    # The chime goes to the room, not to this box, and nothing is played locally
    # at all any more.
    #
    # Playing it locally (silently, for its timing) is what produced the mute
    # face on every wake word: an announcement starting while voice_assistant is
    # not yet running is indistinguishable, to on_announcement, from the user
    # starting media playback -- so it drew the muted page, then the idle page
    # when the silent clip ended, and only then the listening page. Removing the
    # local playback removes all three frames; the gap is now an explicit delay.
    - homeassistant.service:
        service: ctrlable_snapcast_tts.chime
        data:
          satellite_id: "${snapcast_satellite_id}"
          wake_word: !lambda return id(current_wake_word);
          chime: wake
          volume: !lambda return to_string((int)(id(va_media_player).volume * 100));

    # Nothing of ours is playing, but a previous reply might still be draining.
    - wait_until:
        - and:
            - not:
                media_player.is_announcing:
            - not:
                speaker.is_playing: null_speaker

    # Hold the mic closed until the room's chime has come and gone.
    - delay: ${chime_lead_in}

    - voice_assistant.start:
        wake_word: !lambda return wake_word;

voice_assistant:
  id: va
  microphone: i2s_mic
  # RECONNECTED, now that the announcement pipeline is silent.
  #
  # This was removed because with it present ESPHome plays the TTS locally, and
  # the local copy could not be silenced: the aw88298's set_mute_off() is a no-op
  # that strands the DAC, and media_player volume/mute does not apply to the
  # ANNOUNCEMENT pipeline at all (measured -- "PLAYING / Muted: YES" followed by
  # full-volume audio; ESPHome plays announcements over the media volume by
  # design). The cost of removing it was assist_satellite never leaving
  # `responding`, because that state is cleared by the announcement-finished
  # report only this connection produces.
  #
  # Routing the pipeline to an unconnected I2S bus gets both: ESPHome plays,
  # reports finished, HA clears the state -- and not a sound comes out. The
  # local decode also runs in real time, so it paces the state machine to
  # roughly the true answer length instead of a fixed timeout.
  media_player: va_media_player
  micro_wake_word: mww
  use_wake_word: false
  noise_suppression_level: 2
  auto_gain: 31dBFS
  volume_multiplier: 2.0
  on_listening:
    # --- Ctrlable Snapcast routing ---
    # Hold the zone for the whole listening window. The wake chime covers the
    # FIRST turn, but a continued conversation ("...and which room?") reopens
    # the mic with NO chime, so nothing held the duck and music played at full
    # volume straight into the microphone. Idempotent; the answer releases it.
    - homeassistant.service:
        service: ctrlable_snapcast_tts.hold
        data:
          satellite_id: "${snapcast_satellite_id}"
          wake_word: !lambda return id(current_wake_word);
    - lambda: id(voice_assistant_phase) = ${voice_assist_listening_phase_id};
    - text_sensor.template.publish:
        id: text_request
        state: "..."
    - text_sensor.template.publish:
        id: text_response
        state: "..."
    - script.execute: draw_display
  on_stt_vad_end:
    - lambda: id(voice_assistant_phase) = ${voice_assist_thinking_phase_id};
    - script.execute: draw_display
    # --- Ctrlable Snapcast routing ---
    # wyoming's done.wav, the same sound the LVA satellites make here. It holds
    # the zone's lock for ~1.5s (1.12s of audio + a shortened drain); intent
    # resolution has been measured at 2-9s, so it clears well before the answer
    # wants the zone.
    - homeassistant.service:
        service: ctrlable_snapcast_tts.chime
        data:
          satellite_id: "${snapcast_satellite_id}"
          wake_word: !lambda return id(current_wake_word);
          chime: thinking
          volume: !lambda return to_string((int)(id(va_media_player).volume * 100));
  on_stt_end:
    - text_sensor.template.publish:
        id: text_request
        state: !lambda return x;
    - script.execute: draw_display
  on_tts_start:
    - text_sensor.template.publish:
        id: text_response
        state: !lambda return x;
    - lambda: id(voice_assistant_phase) = ${voice_assist_replying_phase_id};
    - script.execute: draw_display
  # --- Ctrlable Snapcast routing ---
  # Fires EARLY, while the response is still streaming, so the reply starts in
  # the room without waiting for synthesis to complete.
  on_intent_progress:
    - if:
        condition:
          lambda: return !x.empty() && x != id(last_tts_url);
        then:
          - lambda: id(last_tts_url) = x;
          - script.execute: announce_and_wait
  # Fallback for pipelines that emit no progress events; deduped against the URL.
  on_tts_end:
    - if:
        condition:
          lambda: return !x.empty() && x != id(last_tts_url);
        then:
          - lambda: id(last_tts_url) = x;
          - script.execute: announce_and_wait
  on_end:
    # --- Ctrlable Snapcast routing ---
    # on_end fires when the PIPELINE ends, which here is BEFORE the answer has
    # played a single sample. Returning to idle now IS the stuck-state bug, so
    # defer: finish_response ends the exchange once playback is really over.
    # When nothing is outstanding (e.g. "nevermind") this behaves as upstream.
    - if:
        condition:
          lambda: return !id(responding);
        then:
          # --- Ctrlable Snapcast routing ---
          # Nothing was routed to the room, so nothing will release the zone. The
          # add-on holds the group across an exchange and only the ANSWER lets go;
          # a false wake or an STT no-text would otherwise leave music ducked until
          # its watchdog fires. Unconditional and idempotent -- releasing a zone
          # that is not held is a no-op in the add-on.
          - homeassistant.service:
              service: ctrlable_snapcast_tts.release
              data:
                satellite_id: "${snapcast_satellite_id}"
                wake_word: !lambda return id(current_wake_word);
          - script.execute: end_exchange_locally
  on_error:
    # Only set the error phase if the error code is different than duplicate_wake_up_detected or stt-no-text-recognized
    # These two are ignored for a better user experience
    # --- Ctrlable Snapcast routing ---
    # Nothing was routed to the room, so nothing will release the zone. The
    # add-on holds the group across an exchange and only the ANSWER lets go;
    # a false wake or an STT no-text would otherwise leave music ducked until
    # its watchdog fires. Unconditional and idempotent -- releasing a zone
    # that is not held is a no-op in the add-on.
    - homeassistant.service:
        service: ctrlable_snapcast_tts.release
        data:
          satellite_id: "${snapcast_satellite_id}"
          wake_word: !lambda return id(current_wake_word);
    - if:
        condition:
          and:
            - lambda: return !id(init_in_progress);
            - lambda: return code != "duplicate_wake_up_detected";
            - lambda: return code != "stt-no-text-recognized";
        then:
          - lambda: id(voice_assistant_phase) = ${voice_assist_error_phase_id};
          - script.execute: draw_display
          - delay: 1s
          - if:
              condition:
                switch.is_off: mute
              then:
                - lambda: id(voice_assistant_phase) = ${voice_assist_idle_phase_id};
              else:
                - lambda: id(voice_assistant_phase) = ${voice_assist_muted_phase_id};
        # If the error code is cloud-auth-failed, serve a local audio file guiding the user.
    - if:
        condition:
          - lambda: return code == "cloud-auth-failed";
        then:
          # --- Ctrlable Snapcast routing ---
          # Rare path, but the local speaker is silent now, so without this the
          # user gets no audible signal at all that auth expired.
          - homeassistant.service:
              service: ctrlable_snapcast_tts.chime
              data:
                satellite_id: "${snapcast_satellite_id}"
                wake_word: !lambda return id(current_wake_word);
                chime: error
                volume: !lambda return to_string((int)(id(va_media_player).volume * 100));
          - script.execute: draw_display

  on_client_connected:
    - lambda: id(init_in_progress) = false;
    - script.execute: start_wake_word
    - script.execute: set_idle_or_mute_phase
    - script.execute: draw_display

  on_client_disconnected:
    - script.execute: stop_wake_word
    - lambda: id(voice_assistant_phase) = ${voice_assist_not_ready_phase_id}; 
    - script.execute: draw_display


switch:
  - platform: gpio
    name: "AW RST P0_2"
    pin:
      aw9523b_id: aw9523b_hub
      number: 2
    internal: true
    restore_mode: RESTORE_DEFAULT_ON
    disabled_by_default: true

  - platform: gpio
    name: "CAM RST P1_0"
    pin:
      aw9523b_id: aw9523b_hub
      number: 8
    internal: true
    restore_mode: RESTORE_DEFAULT_ON
    disabled_by_default: true

  - platform: gpio
    name: "BUS_OUT_EN"
    pin:
      aw9523b_id: aw9523b_hub
      number: 1
    # BUS_OUT_EN = 0
    restore_mode: RESTORE_DEFAULT_OFF

  - platform: gpio
    name: "USB_OTG_EN"
    pin:
      aw9523b_id: aw9523b_hub
      number: 5
    # USB_OTG_EN = 0
    restore_mode: RESTORE_DEFAULT_OFF

  - platform: gpio
    name: "BOOST_EN"
    pin:
      aw9523b_id: aw9523b_hub
      number: 15
    # BOOST_EN
    restore_mode: RESTORE_DEFAULT_ON

  - platform: template
    name: Microphone Mute
    id: mute
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    on_turn_off:
        - microphone.unmute:
        - lambda: id(voice_assistant_phase) = ${voice_assist_idle_phase_id};
        - script.execute: draw_display
        
    on_turn_on:
        - microphone.mute:
        - lambda: id(voice_assistant_phase) = ${voice_assist_muted_phase_id};
        - script.execute: draw_display

select:
  - platform: template
    entity_category: config
    name: Wake word engine location
    id: wake_word_engine_location
    icon: "mdi:account-voice"
    optimistic: true
    restore_value: true
    options:
      - In Home Assistant
      - On device
    initial_option: On device
    on_value:
      - if:
          condition:
            lambda: return !id(init_in_progress);
          then:
            - wait_until:
                lambda: return id(voice_assistant_phase) == ${voice_assist_muted_phase_id} || id(voice_assistant_phase) == ${voice_assist_idle_phase_id};
            - if:
                condition:
                  lambda: return x == "In Home Assistant";
                then:
                  - micro_wake_word.stop
                  - delay: 500ms
                  - if:
                      condition:
                        switch.is_off: mute
                      then:
                        - lambda: id(va).set_use_wake_word(true);
                        - voice_assistant.start_continuous:
            - if:
                condition:
                  lambda: return x == "On device";
                then:
                  - lambda: id(va).set_use_wake_word(false);
                  - voice_assistant.stop
                  - delay: 500ms
                  - if:
                      condition:
                        switch.is_off: mute
                      then:
                        - micro_wake_word.start


  - platform: template
    name: "Wake word sensitivity"
    optimistic: true
    initial_option: Slightly sensitive
    restore_value: true
    entity_category: config
    options:
      - Slightly sensitive
      - Moderately sensitive
      - Very sensitive
    on_value:
      # Sets specific wake word probabilities computed for each particular model
      # Note probability cutoffs are set as a quantized uint8 value, each comment has the corresponding floating point cutoff
      # False Accepts per Hour values are tested against all units and channels from the Dinner Party Corpus.
      # These cutoffs apply only to the specific models included in the firmware: okay_nabu@20241226.3, hey_jarvis@v2, hey_mycroft@v2
      lambda: |-
        if (x == "Slightly sensitive") {
          id(okay_nabu).set_probability_cutoff(217);    // 0.85 -> 0.000 FAPH on DipCo (Manifest's default)
          id(hey_jarvis).set_probability_cutoff(247);   // 0.97 -> 0.563 FAPH on DipCo (Manifest's default)
          id(hey_mycroft).set_probability_cutoff(253);  // 0.99 -> 0.567 FAPH on DipCo
        } else if (x == "Moderately sensitive") {
          id(okay_nabu).set_probability_cutoff(176);    // 0.69 -> 0.376 FAPH on DipCo
          id(hey_jarvis).set_probability_cutoff(235);   // 0.92 -> 0.939 FAPH on DipCo
          id(hey_mycroft).set_probability_cutoff(242);  // 0.95 -> 1.502 FAPH on DipCo (Manifest's default)
        } else if (x == "Very sensitive") {
          id(okay_nabu).set_probability_cutoff(143);    // 0.56 -> 0.751 FAPH on DipCo
          id(hey_jarvis).set_probability_cutoff(212);   // 0.83 -> 1.502 FAPH on DipCo
          id(hey_mycroft).set_probability_cutoff(237);  // 0.93 -> 1.878 FAPH on DipCo
        }

display:
  - platform: mipi_spi
    model: M5CORE
    dc_pin: GPIO35
    reset_pin:
      aw9523b_id: aw9523b_hub
      number: 9
    cs_pin:
      number: GPIO3
      ignore_strapping_warning: true
    data_rate: 40MHz
    update_interval: never
    invert_colors: true
    id: m5cores3_lcd
    pages:
      - id: idle_page
        lambda: |-
          it.fill(id(idle_color));
          it.image((it.get_width() / 2), (it.get_height() / 2), id(casita_idle), ImageAlign::CENTER);
          // Mute button. Touch zone is x>=250, y>=170 -- see touchscreen.on_touch.
          it.print(283, 200, id(mdi_icon_36), Color::WHITE, TextAlign::CENTER,
                   id(mute).state ? "\U000F036D" : "\U000F036C");
      - id: awake_page
        lambda: |-
          it.fill(id(awake_color));
          it.image((it.get_width() / 2), (it.get_height() / 2), id(casita_awake), ImageAlign::CENTER);
      - id: listening_page
        lambda: |-
          it.fill(id(listening_color));
          it.image((it.get_width() / 2), (it.get_height() / 2), id(casita_listening), ImageAlign::CENTER);
          // Mute button. Touch zone is x>=250, y>=170 -- see touchscreen.on_touch.
          it.print(283, 200, id(mdi_icon_36), Color::WHITE, TextAlign::CENTER,
                   id(mute).state ? "\U000F036D" : "\U000F036C");
      - id: thinking_page
        lambda: |-
          it.fill(id(thinking_color));
          it.image((it.get_width() / 2), (it.get_height() / 2), id(casita_thinking), ImageAlign::CENTER);
          it.filled_rectangle(20 , 20 , 280 , 30 , Color::WHITE );
          it.rectangle(20 , 20 , 280 , 30 , Color::BLACK );
          it.printf(30, 25, id(font_request), Color::BLACK, "%s", id(text_request).state.c_str());
      - id: replying_page
        lambda: |-
          it.fill(id(replying_color));
          it.image((it.get_width() / 2), (it.get_height() / 2), id(casita_replying), ImageAlign::CENTER);
          it.filled_rectangle(20 , 20 , 280 , 30 , Color::WHITE );
          it.rectangle(20 , 20 , 280 , 30 , Color::BLACK );
          it.filled_rectangle(20 , 190 , 280 , 30 , Color::WHITE );
          it.rectangle(20 , 190 , 280 , 30 , Color::BLACK );
          it.printf(30, 25, id(font_request), Color::BLACK, "%s", id(text_request).state.c_str());
          it.printf(30, 195, id(font_response), Color::BLACK, "%s", id(text_response).state.c_str());
      - id: error_page
        lambda: |-
          it.fill(id(error_color));
          it.image((it.get_width() / 2), (it.get_height() / 2), id(casita_error), ImageAlign::CENTER);
      - id: no_ha_page
        lambda: |-
          it.image((it.get_width() / 2), (it.get_height() / 2), id(error_no_ha), ImageAlign::CENTER);
      - id: no_wifi_page
        lambda: |-
          it.image((it.get_width() / 2), (it.get_height() / 2), id(error_no_wifi), ImageAlign::CENTER);
      - id: initializing_page
        lambda: |-
          it.fill(id(loading_color));
          it.image((it.get_width() / 2), (it.get_height() / 2), id(casita_initializing), ImageAlign::CENTER);
      - id: muted_page
        lambda: |-
          it.fill(Color::BLACK);
          it.image((it.get_width() / 2), (it.get_height() / 2), id(ctrlable_muted), ImageAlign::CENTER);
          // Mute button. Touch zone is x>=250, y>=170 -- see touchscreen.on_touch.
          it.print(283, 200, id(mdi_icon_36), Color::WHITE, TextAlign::CENTER,
                   id(mute).state ? "\U000F036D" : "\U000F036C");

touchscreen:
  - platform: ft63x6
    id: touch
    i2c_id: bsp_bus
    reset_pin:
      aw9523b_id: aw9523b_hub
      number: 0
    calibration:
      x_min: 0
      x_max: 320
      y_min: 0
      y_max: 240
    on_touch:
      - lambda: |-
            ESP_LOGD("touch", "x=%d, y=%d", touch.x, touch.y);
      # A touch on a sleeping screen only wakes it. Waking and acting on the
      # same tap means you cannot see what you are about to press.
      - if:
          condition:
            lambda: return !id(lcd_backlight).current_values.is_on();
          then:
            - script.execute: screen_wake
          else:
            - script.execute: screen_wake
            # Bottom-right corner, and only on the pages that draw the button.
            # thinking/replying overlay text boxes exactly where it would sit.
            - if:
                condition:
                  lambda: |-
                    return touch.x >= 250 && touch.y >= 170
                        && (id(voice_assistant_phase) == ${voice_assist_idle_phase_id}
                         || id(voice_assistant_phase) == ${voice_assist_muted_phase_id}
                         || id(voice_assistant_phase) == ${voice_assist_listening_phase_id});
                then:
                  - switch.toggle: mute

script:
  # --- Ctrlable Snapcast routing ------------------------------------------
  # Upstream's on_end body, moved verbatim so it can be called from two places:
  # directly (no Snapcast reply pending) or from finish_response (after one).
  - id: end_exchange_locally
    then:
    # Wait a short amount of time to see if an announcement starts
    - wait_until:
        condition:
          - media_player.is_announcing:
        timeout: 0.5s
    # Announcement is finished and the I2S bus is free
    - wait_until:
        - and:
            - not:
                media_player.is_announcing:
            - not:
                speaker.is_playing: null_speaker
    # Restart only mWW if enabled; streaming wake words automatically restart
    - if:
        condition:
          - lambda: return id(wake_word_engine_location).current_option() == "On device";
        then:
          - lambda: id(va).set_use_wake_word(false);
          - micro_wake_word.start:
    - script.execute: set_idle_or_mute_phase
    - script.execute: draw_display
    # Clear text sensors
    - text_sensor.template.publish:
        id: text_request
        state: ""
    - text_sensor.template.publish:
        id: text_response
        state: ""

  # Hand the answer to the add-on. Uses the HA service, NOT a direct POST, so
  # the add-on URL and bearer token stay in the integration's config flow
  # instead of being duplicated into every device's firmware and secrets.yaml.
  #
  # homeassistant.service is fire-and-forget, so this call itself says nothing
  # about when playback ended. The signal comes back the other way: the
  # integration holds ${snapcast_announcing_entity} ON for the span of the
  # announce, and the add-on only returns once the room has stopped talking, so
  # that sensor's ON->OFF edge is the real end of playback. Verified 2026-08-09 --
  # a 23.2s hold for a long answer and 3.4s for a short one, tracking the audio
  # rather than any timeout. announce_max_wait below is now only a backstop.
  - id: announce_and_wait
    mode: restart
    then:
      - lambda: id(responding) = true;
      # Stop listening while the room is talking: the answer plays through
      # speakers near this mic and would otherwise re-trigger the wake word.
      - script.execute: stop_wake_word
      - homeassistant.service:
          service: ctrlable_snapcast_tts.announce
          data:
            url: !lambda return id(last_tts_url);
            satellite_id: "${snapcast_satellite_id}"
            wake_word: !lambda return id(current_wake_word);
            # The volume control that actually does something. This device's
            # speaker is out of the path, so the slider has to reach the
            # snapclient or it reaches nothing -- which is exactly what it did
            # before: swept 34% -> 7% across four exchanges with no audible
            # change, because the client sat at 55% the whole time.
            volume: !lambda return to_string((int)(id(va_media_player).volume * 100));
      # Normal path is snapcast_announcing going ON then OFF above. This only
      # fires if that never arrives -- HA down, integration too old to expose
      # the entity, or the sensor wedged ON.
      - delay: ${announce_max_wait}
      - if:
          condition:
            lambda: return id(responding);
          then:
            - logger.log: "announce completion signal never arrived; releasing on backstop"
            - script.execute: finish_response

  # The single place an exchange ends once an answer was routed to Snapcast.
  - id: finish_response
    then:
      - lambda: |-
          id(responding) = false;
          id(last_tts_url) = "";
          id(current_wake_word) = "";
      - script.execute: end_exchange_locally

  - id: draw_display
    then:
      # Anything worth redrawing is worth looking at, so every redraw relights
      # the screen and restarts the sleep countdown. The transition back to idle
      # at the end of an exchange is itself a redraw, which is what re-arms it.
      - script.execute: screen_wake
      - if:
          condition:
            lambda: return !id(init_in_progress);
          then:
            - if:
                condition:
                  wifi.connected:
                then:
                  - if:
                      condition:
                        api.connected:
                      then:
                        - lambda: |
                            switch(id(voice_assistant_phase)) {
                              case ${voice_assist_awake_phase_id}:
                                id(m5cores3_lcd).show_page(awake_page);
                                id(m5cores3_lcd).update();
                                break;
                              case ${voice_assist_listening_phase_id}:
                                id(m5cores3_lcd).show_page(listening_page);
                                id(m5cores3_lcd).update();
                                break;
                              case ${voice_assist_thinking_phase_id}:
                                id(m5cores3_lcd).show_page(thinking_page);
                                id(m5cores3_lcd).update();
                                break;
                              case ${voice_assist_replying_phase_id}:
                                id(m5cores3_lcd).show_page(replying_page);
                                id(m5cores3_lcd).update();
                                break;
                              case ${voice_assist_error_phase_id}:
                                id(m5cores3_lcd).show_page(error_page);
                                id(m5cores3_lcd).update();
                                break;
                              case ${voice_assist_muted_phase_id}:
                                id(m5cores3_lcd).show_page(muted_page);
                                id(m5cores3_lcd).update();
                                break;
                              case ${voice_assist_not_ready_phase_id}:
                                id(m5cores3_lcd).show_page(no_ha_page);
                                id(m5cores3_lcd).update();
                                break;
                              default:
                                id(m5cores3_lcd).show_page(idle_page);
                                id(m5cores3_lcd).update();
                            }
                      else:
                        - display.page.show: no_ha_page
                        - component.update: m5cores3_lcd
                else:
                  - display.page.show: no_wifi_page
                  - component.update: m5cores3_lcd
          else:
            - display.page.show: initializing_page
            - component.update: m5cores3_lcd
  # Starts either mWW or the streaming wake word, depending on the configured location
  - id: start_wake_word
    then:
      - if:
          condition:
            and:
              - not:
                  - voice_assistant.is_running:
              - lambda: |-
                  return id(wake_word_engine_location).current_option() == "On device";
          then:
            - lambda: id(va).set_use_wake_word(false);
            - micro_wake_word.start:
      - if:
          condition:
            and:
              - not:
                  - voice_assistant.is_running:
              - lambda: |-
                  return id(wake_word_engine_location).current_option() == "In Home Assistant";
          then:
            - lambda: id(va).set_use_wake_word(true);
            - voice_assistant.start_continuous:
  # Stops either mWW or the streaming wake word, depending on the configured location
  - id: stop_wake_word
    then:
      - if:
          condition:
            lambda: |-
              return id(wake_word_engine_location).current_option() == "In Home Assistant";
          then:
            - lambda: id(va).set_use_wake_word(false);
            - voice_assistant.stop:
      - if:
          condition:
            lambda: |-
              return id(wake_word_engine_location).current_option() == "On device";
          then:
            - micro_wake_word.stop:

  # Screen blanking. One script, mode: restart -- every call relights and
  # restarts the countdown, so there is no separate timer to keep in sync.
  - id: screen_wake
    mode: restart
    then:
      - light.turn_on:
          id: lcd_backlight
          brightness: 80%
      - delay: ${screen_timeout}
      # Only ever sleep from a resting phase. Without this a long answer would
      # go dark mid-sentence, and the countdown is not restarted while the
      # phase holds steady.
      - if:
          condition:
            lambda: |-
              return id(voice_assistant_phase) == ${voice_assist_idle_phase_id}
                  || id(voice_assistant_phase) == ${voice_assist_muted_phase_id};
          then:
            - light.turn_off: lcd_backlight

  - id: set_idle_or_mute_phase
    then:
      - if:
          condition:
            switch.is_off: mute
          then:
            - lambda: id(voice_assistant_phase) = ${voice_assist_idle_phase_id};
          else:
            - lambda: id(voice_assistant_phase) = ${voice_assist_muted_phase_id};

