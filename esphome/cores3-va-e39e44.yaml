# M5Stack CoreS3 — Ctrlable Snapcast voice satellite
# Complete, self-contained. Drop into your ESPHome config directory and build.
#
# REQUIRED in secrets.yaml
#   wifi_ssid: "..."
#   wifi_password: "..."
#   api_encryption_key: "..."            # base64, `openssl rand -base64 32`
#   snapcast_addon_auth: "Bearer <token>"  # FULL header value, including "Bearer "
#
# REQUIRED in the add-on
#   A mapping for satellite_id == the `name` below, or every announce returns
#   404 "Satellite has no mapping":
#     POST /mappings
#     {"satellite_id":"cores3-va-e39e44","wake_word":"*",
#      "target_snapclient_ids":["snapclient6#6"],"notes":"CoreS3 living room"}
#   Get exact client ids from GET /snapcast/clients first.
#
# WHY THERE IS NO speaker: OR media_player:
# -----------------------------------------
# Not an omission. With either registered, ESPHome auto-routes the TTS URL to
# the local device -- which OOM-looped the Atom, and here would defeat the whole
# design: the answer is meant to come out of the room's real speakers through
# Snapcast. The CoreS3 has a good DAC and it is tempting to "add the speaker
# back"; doing so silently reverts the routing. The aw88298 DAC component is
# left out for the same reason.
#
# HOW THE SATELLITE KNOWS THE ANSWER FINISHED
# -------------------------------------------
# It POSTs to the add-on itself and waits. /announce/by_satellite awaits playback
# and returns the duration, so the HTTP reply IS the end-of-playback signal.
#
# The previous approach used `homeassistant.service`, which is fire-and-forget:
# no response ever came back, so on_end fired the moment the PIPELINE finished --
# before a single sample had played -- and the device cleared state, resumed the
# wake word while the reply was still coming out of the speakers beside its mic,
# and told HA it was idle. That is the stuck-state bug. Everything that ends an
# exchange now lives in finish_response and nowhere else.

substitutions:
  name: cores3-va-e39e44
  friendly_name: "Ctrlable Living Room CoreS3"
  micro_wake_word_model: okay_nabu
  snapcast_addon_url: "http://10.1.8.23:8099"

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  min_version: "2025.5.0"

esp32:
  variant: esp32s3
  flash_size: 16MB
  cpu_frequency: 240MHz
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_ESP32S3_DATA_CACHE_64KB: "y"
      CONFIG_ESP32S3_DATA_CACHE_LINE_64B: "y"
      CONFIG_ESP32S3_INSTRUCTION_CACHE_32KB: "y"
      CONFIG_SPIRAM_RODATA: "y"
      CONFIG_SPIRAM_FETCH_INSTRUCTIONS: "y"
      CONFIG_BT_ALLOCATION_FROM_SPIRAM_FIRST: "y"
      CONFIG_BT_BLE_DYNAMIC_ENV_MEMORY: "y"
      CONFIG_MBEDTLS_EXTERNAL_MEM_ALLOC: "y"
      CONFIG_MBEDTLS_SSL_PROTO_TLS1_3: "y"

psram:
  mode: quad
  speed: 80MHz

external_components:
  # aw88298 (DAC) intentionally absent -- see header.
  - source: github://m5stack/esphome-yaml/components
    components: [axp2101, aw9523b]
    refresh: 0s

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: NONE
  ap:
    ssid: "${friendly_name} Fb"

captive_portal:

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome

logger:

# timeout must exceed the longest plausible answer: the add-on holds this
# request open for the whole of playback, so a long reply would otherwise be
# indistinguishable from a failure.
http_request:
  id: http_client
  timeout: 60s
  verify_ssl: false

i2c:
  - id: bsp_bus
    sda: GPIO12
    scl: GPIO11
  - id: ext_bus
    sda: GPIO2
    scl: GPIO1
    scan: true

# The PMIC switches the ES7210's rail. Without this block the microphone is
# simply unpowered, and it presents as a software fault rather than a dead chip.
axp2101:
  id: axp2101_pmu
  i2c_id: bsp_bus

aw9523b:
  id: aw9523b_hub
  i2c_id: bsp_bus
  p0_drive_mode: PUSH_PULL

globals:
  # on_intent_progress and on_tts_end can carry the same URL for one exchange;
  # announcing twice plays the answer twice in the room.
  - id: last_tts_url
    type: std::string
    restore_value: false
    initial_value: '""'
  # Passed to the add-on so a mapping can route per wake word.
  - id: current_wake_word
    type: std::string
    restore_value: false
    initial_value: '""'
  # Set while an announce is outstanding. Everything that must not happen
  # mid-answer keys off this.
  - id: responding
    type: bool
    restore_value: false
    initial_value: 'false'

i2s_audio:
  id: i2s_audio_bus
  i2s_lrclk_pin: GPIO33
  i2s_bclk_pin: GPIO34
  i2s_mclk_pin:
    number: GPIO0
    ignore_strapping_warning: true

audio_adc:
  - platform: es7210
    id: es7210_adc
    i2c_id: bsp_bus
    bits_per_sample: 16bit
    sample_rate: 16000
    mic_gain: 36

microphone:
  - platform: i2s_audio
    id: echo_microphone
    i2s_din_pin: GPIO14
    adc_type: external
    sample_rate: 16000
    bits_per_sample: 16bit
    i2s_audio_id: i2s_audio_bus

micro_wake_word:
  id: mww
  vad:
  models:
    - model: ${micro_wake_word_model}
  on_wake_word_detected:
    - lambda: 'id(current_wake_word) = wake_word;'
    - voice_assistant.start:
        wake_word: !lambda return wake_word;

button:
  - platform: factory_reset
    name: "Factory reset"

select:
  - platform: template
    id: wake_word_engine
    name: "Wake word engine"
    entity_category: config
    optimistic: true
    restore_value: true
    options:
      - On device
      - In Home Assistant
    initial_option: On device
    on_value:
      - if:
          condition:
            lambda: 'return x == "In Home Assistant";'
          then:
            - micro_wake_word.stop:
            - delay: 500ms
            - lambda: 'id(va).set_use_wake_word(true);'
            - voice_assistant.start_continuous:
      - if:
          condition:
            lambda: 'return x == "On device";'
          then:
            - lambda: 'id(va).set_use_wake_word(false);'
            - voice_assistant.stop:
            - delay: 500ms
            - micro_wake_word.start:

script:
  # Hand the answer to the add-on and WAIT for it to confirm playback finished.
  # mode: restart so a later progress event supersedes an in-flight request
  # rather than stacking two announces of the same reply.
  - id: announce_and_wait
    mode: restart
    then:
      - lambda: 'id(responding) = true;'
      # Stop listening while the room is talking: the answer plays through the
      # speakers next to this mic and would otherwise re-trigger the wake word,
      # so the satellite interrupts itself mid-sentence.
      - script.execute: stop_wake_word
      - http_request.post:
          url: ${snapcast_addon_url}/announce/by_satellite
          headers:
            Content-Type: application/json
            Authorization: !secret snapcast_addon_auth
          json: |-
            root["satellite_id"] = "${name}";
            root["url"] = id(last_tts_url);
            root["wake_word"] = id(current_wake_word);
            root["source_host"] = "${name}";
          on_response:
            then:
              # Reached only once the add-on has finished playing.
              - script.execute: finish_response
          on_error:
            then:
              - logger.log: "snapcast announce failed -- releasing state anyway"
              - script.execute: finish_response

  # The single place an exchange ends. Anything that clears state or resumes
  # listening belongs here and nowhere else.
  - id: finish_response
    then:
      - lambda: |-
          id(responding) = false;
          id(last_tts_url) = "";
          id(current_wake_word) = "";
      - script.execute: start_wake_word

  - id: start_wake_word
    then:
      - if:
          condition:
            and:
              - not:
                  voice_assistant.is_running:
              - lambda: 'return id(wake_word_engine).current_option() == "On device";'
          then:
            - lambda: 'id(va).set_use_wake_word(false);'
            - micro_wake_word.start:
      - if:
          condition:
            and:
              - not:
                  voice_assistant.is_running:
              - lambda: 'return id(wake_word_engine).current_option() == "In Home Assistant";'
          then:
            - lambda: 'id(va).set_use_wake_word(true);'
            - voice_assistant.start_continuous:

  - id: stop_wake_word
    then:
      - if:
          condition:
            lambda: 'return id(wake_word_engine).current_option() == "In Home Assistant";'
          then:
            - lambda: 'id(va).set_use_wake_word(false);'
            - voice_assistant.stop:
      - if:
          condition:
            lambda: 'return id(wake_word_engine).current_option() == "On device";'
          then:
            - micro_wake_word.stop:

voice_assistant:
  id: va
  microphone:
    microphone: echo_microphone
    # 1, not the Atom's 4: the ES7210 already applies mic_gain 36 in hardware.
    # Stacking both clips, and clipping presents as poor recognition rather than
    # as audible distortion, so it is easy to misdiagnose. Raise only if STT is
    # genuinely weak.
    gain_factor: 1
  micro_wake_word: mww
  use_wake_word: false
  noise_suppression_level: 2
  auto_gain: 31dBFS
  volume_multiplier: 4.0
  conversation_timeout: 40s

  # Fires EARLY, while the response is still streaming -- this is what makes the
  # reply feel immediate instead of waiting for synthesis to complete.
  on_intent_progress:
    - if:
        condition:
          lambda: 'return !x.empty() && x != id(last_tts_url);'
        then:
          - lambda: 'id(last_tts_url) = x;'
          - script.execute: announce_and_wait

  # Fallback for pipelines that emit no progress events. Deduped against
  # last_tts_url so a normal exchange announces exactly once.
  on_tts_end:
    - if:
        condition:
          lambda: 'return !x.empty() && x != id(last_tts_url);'
        then:
          - lambda: 'id(last_tts_url) = x;'
          - script.execute: announce_and_wait

  # on_end fires when the PIPELINE finishes, which here is BEFORE the answer has
  # played. Resuming the wake word or clearing state here is exactly the bug.
  # Only act when nothing is outstanding -- e.g. "nevermind", no reply to wait for.
  on_end:
    - if:
        condition:
          lambda: 'return !id(responding);'
        then:
          - delay: 200ms
          - script.execute: start_wake_word

  on_error:
    - if:
        condition:
          lambda: 'return !id(responding);'
        then:
          - lambda: |-
              id(last_tts_url) = "";
              id(current_wake_word) = "";
          - delay: 2s
          - script.execute: start_wake_word

  on_client_connected:
    - delay: 2s
    - script.execute: start_wake_word

  on_client_disconnected:
    - script.execute: stop_wake_word
