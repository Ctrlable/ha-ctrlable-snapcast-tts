# Ctrlable Atom Echo — Snapcast satellite
#
# Routes every TTS response to Snapcast via the ctrlable_snapcast_tts HA
# service. No speaker or media_player components are registered, so
# ESPHome never auto-routes TTS URLs locally — zero OOM loop.
#
# Wake word engine is configurable from HA at runtime via the
# "Wake word engine" select:
#   On device   — micro_wake_word (low-latency, no cloud)
#   In HA       — Home Assistant cloud / on-server wake word
#
# Required substitutions:
#   name:                  kebab-case device name  (also used as satellite_id)
#   friendly_name:         human-readable label
#   micro_wake_word_model: e.g. okay_nabu, hey_jarvis

substitutions:
  micro_wake_word_model: okay_nabu

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  min_version: "2025.5.0"

esp32:
  board: m5stack-atom
  cpu_frequency: 240MHz
  framework:
    type: esp-idf

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: NONE
  ap:
    ssid: "${friendly_name} Fb"

captive_portal:

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome

logger:

globals:
  - id: last_tts_url
    type: std::string
    restore_value: false
    initial_value: '""'
  - id: current_wake_word
    type: std::string
    restore_value: false
    initial_value: '""'

i2s_audio:
  - id: i2s_audio_bus
    i2s_lrclk_pin: GPIO33
    i2s_bclk_pin: GPIO19

microphone:
  - platform: i2s_audio
    id: echo_microphone
    i2s_audio_id: i2s_audio_bus
    i2s_din_pin: GPIO23
    adc_type: external
    pdm: true
    sample_rate: 16000
    correct_dc_offset: true

micro_wake_word:
  id: mww
  vad:
  models:
    - model: ${micro_wake_word_model}
  on_wake_word_detected:
    - lambda: 'id(current_wake_word) = wake_word;'
    - voice_assistant.start:
        wake_word: !lambda return wake_word;

button:
  - platform: factory_reset
    name: "Factory reset"

light:
  - platform: esp32_rmt_led_strip
    id: status_led
    name: None
    internal: true
    rgb_order: GRB
    pin: GPIO27
    num_leds: 1
    chipset: SK6812
    default_transition_length: 0s
    effects:
      - pulse:
          name: "Slow Pulse"
          transition_length: 250ms
          update_interval: 250ms
          min_brightness: 50%
          max_brightness: 100%
      - pulse:
          name: "Fast Pulse"
          transition_length: 100ms
          update_interval: 100ms
          min_brightness: 50%
          max_brightness: 100%

binary_sensor:
  - platform: gpio
    pin:
      number: GPIO39
      inverted: true
    name: "Wake button"
    on_press:
      - script.execute: start_wake_word

switch:
  - platform: template
    id: use_listen_light
    name: "Use listen light"
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    entity_category: config
    on_turn_on:
      - script.execute: reset_led
    on_turn_off:
      - script.execute: reset_led

select:
  - platform: template
    id: wake_word_engine
    name: "Wake word engine"
    entity_category: config
    optimistic: true
    restore_value: true
    options:
      - On device
      - In Home Assistant
    initial_option: On device
    on_value:
      - if:
          condition:
            lambda: 'return x == "In Home Assistant";'
          then:
            - micro_wake_word.stop:
            - delay: 500ms
            - lambda: 'id(va).set_use_wake_word(true);'
            - voice_assistant.start_continuous:
      - if:
          condition:
            lambda: 'return x == "On device";'
          then:
            - lambda: 'id(va).set_use_wake_word(false);'
            - voice_assistant.stop:
            - delay: 500ms
            - micro_wake_word.start:

script:
  - id: reset_led
    then:
      - if:
          condition:
            switch.is_on: use_listen_light
          then:
            - if:
                condition:
                  lambda: 'return id(wake_word_engine).current_option() == "On device";'
                then:
                  - light.turn_on:
                      id: status_led
                      red: 100%
                      green: 89%
                      blue: 71%
                      brightness: 60%
                      effect: none
                else:
                  - light.turn_on:
                      id: status_led
                      red: 0%
                      green: 100%
                      blue: 100%
                      brightness: 60%
                      effect: none
          else:
            - light.turn_off: status_led

  - id: start_wake_word
    then:
      - if:
          condition:
            and:
              - not:
                  voice_assistant.is_running:
              - lambda: 'return id(wake_word_engine).current_option() == "On device";'
          then:
            - lambda: 'id(va).set_use_wake_word(false);'
            - micro_wake_word.start:
      - if:
          condition:
            and:
              - not:
                  voice_assistant.is_running:
              - lambda: 'return id(wake_word_engine).current_option() == "In Home Assistant";'
          then:
            - lambda: 'id(va).set_use_wake_word(true);'
            - voice_assistant.start_continuous:

  - id: stop_wake_word
    then:
      - if:
          condition:
            lambda: 'return id(wake_word_engine).current_option() == "In Home Assistant";'
          then:
            - lambda: 'id(va).set_use_wake_word(false);'
            - voice_assistant.stop:
      - if:
          condition:
            lambda: 'return id(wake_word_engine).current_option() == "On device";'
          then:
            - micro_wake_word.stop:

voice_assistant:
  id: va
  microphone:
    microphone: echo_microphone
    gain_factor: 4
  micro_wake_word: mww
  use_wake_word: false
  noise_suppression_level: 2
  auto_gain: 31dBFS
  volume_multiplier: 4.0
  conversation_timeout: 40s

  on_intent_progress:
    - if:
        condition:
          lambda: 'return !x.empty();'
        then:
          - lambda: 'id(last_tts_url) = x;'
          - homeassistant.service:
              service: ctrlable_snapcast_tts.announce
              data:
                url: !lambda 'return x;'
                satellite_id: "${name}"
                wake_word: !lambda 'return id(current_wake_word);'

  on_tts_end:
    - if:
        condition:
          lambda: 'return !x.empty() && x != id(last_tts_url);'
        then:
          - lambda: 'id(last_tts_url) = x;'
          - homeassistant.service:
              service: ctrlable_snapcast_tts.announce
              data:
                url: !lambda 'return x;'
                satellite_id: "${name}"
                wake_word: !lambda 'return id(current_wake_word);'

  on_listening:
    - light.turn_on:
        id: status_led
        blue: 100%
        red: 0%
        green: 0%
        effect: "Slow Pulse"

  on_stt_vad_end:
    - light.turn_on:
        id: status_led
        blue: 100%
        red: 0%
        green: 0%
        effect: "Fast Pulse"

  on_tts_start:
    - light.turn_on:
        id: status_led
        blue: 100%
        red: 0%
        green: 0%
        brightness: 100%
        effect: none

  on_end:
    - lambda: 'id(last_tts_url) = "";'
    - lambda: 'id(current_wake_word) = "";'
    - delay: 200ms
    - script.execute: reset_led
    - script.execute: start_wake_word

  on_error:
    - lambda: 'id(last_tts_url) = "";'
    - lambda: 'id(current_wake_word) = "";'
    - light.turn_on:
        id: status_led
        red: 100%
        green: 0%
        blue: 0%
        brightness: 100%
        effect: none
    - delay: 2s
    - script.execute: reset_led
    - script.execute: start_wake_word

  on_client_connected:
    - delay: 2s
    - script.execute: start_wake_word

  on_client_disconnected:
    - script.execute: stop_wake_word
