# Ctrlable Atom Echo — on-board speaker satellite
#
# Plays TTS through the built-in I2S speaker. Wake word engine is
# configurable from HA at runtime via the "Wake word engine" select:
#   On device   — micro_wake_word (low-latency, no cloud)
#   In HA       — Home Assistant cloud / on-server wake word
#
# Required substitutions:
#   name:                  kebab-case device name
#   friendly_name:         human-readable label
#   micro_wake_word_model: e.g. okay_nabu, hey_jarvis

substitutions:
  micro_wake_word_model: okay_nabu

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  min_version: "2025.5.0"

esp32:
  board: m5stack-atom
  cpu_frequency: 240MHz
  framework:
    type: esp-idf

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: NONE
  ap:
    ssid: "${friendly_name} Fb"

captive_portal:

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome

logger:

i2s_audio:
  - id: i2s_audio_bus
    i2s_lrclk_pin: GPIO33
    i2s_bclk_pin: GPIO19

microphone:
  - platform: i2s_audio
    id: echo_microphone
    i2s_audio_id: i2s_audio_bus
    i2s_din_pin: GPIO23
    adc_type: external
    pdm: true
    sample_rate: 16000
    correct_dc_offset: true

speaker:
  - platform: i2s_audio
    id: i2s_speaker
    i2s_audio_id: i2s_audio_bus
    i2s_dout_pin: GPIO22
    dac_type: external
    bits_per_sample: 16bit
    sample_rate: 16000
    channel: stereo
    buffer_duration: 60ms

media_player:
  - platform: speaker
    id: tts_media_player
    name: None
    internal: true
    announcement_pipeline:
      speaker: i2s_speaker
      format: WAV
    codec_support_enabled: false
    buffer_size: 6000
    volume_min: 0.4

micro_wake_word:
  id: mww
  vad:
  models:
    - model: ${micro_wake_word_model}
  on_wake_word_detected:
    - voice_assistant.start:
        wake_word: !lambda return wake_word;

button:
  - platform: factory_reset
    name: "Factory reset"

light:
  - platform: esp32_rmt_led_strip
    id: status_led
    name: None
    internal: true
    rgb_order: GRB
    pin: GPIO27
    num_leds: 1
    chipset: SK6812
    default_transition_length: 0s
    effects:
      - pulse:
          name: "Slow Pulse"
          transition_length: 250ms
          update_interval: 250ms
          min_brightness: 50%
          max_brightness: 100%
      - pulse:
          name: "Fast Pulse"
          transition_length: 100ms
          update_interval: 100ms
          min_brightness: 50%
          max_brightness: 100%

binary_sensor:
  - platform: gpio
    pin:
      number: GPIO39
      inverted: true
    name: "Wake button"
    on_press:
      - script.execute: start_wake_word

switch:
  - platform: template
    id: use_listen_light
    name: "Use listen light"
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    entity_category: config
    on_turn_on:
      - script.execute: reset_led
    on_turn_off:
      - script.execute: reset_led

select:
  - platform: template
    id: wake_word_engine
    name: "Wake word engine"
    entity_category: config
    optimistic: true
    restore_value: true
    options:
      - On device
      - In Home Assistant
    initial_option: On device
    on_value:
      - if:
          condition:
            lambda: 'return x == "In Home Assistant";'
          then:
            - micro_wake_word.stop:
            - delay: 500ms
            - lambda: 'id(va).set_use_wake_word(true);'
            - voice_assistant.start_continuous:
      - if:
          condition:
            lambda: 'return x == "On device";'
          then:
            - lambda: 'id(va).set_use_wake_word(false);'
            - voice_assistant.stop:
            - delay: 500ms
            - micro_wake_word.start:

script:
  - id: reset_led
    then:
      - if:
          condition:
            switch.is_on: use_listen_light
          then:
            - if:
                condition:
                  lambda: 'return id(wake_word_engine).current_option() == "On device";'
                then:
                  - light.turn_on:
                      id: status_led
                      red: 100%
                      green: 89%
                      blue: 71%
                      brightness: 60%
                      effect: none
                else:
                  - light.turn_on:
                      id: status_led
                      red: 0%
                      green: 100%
                      blue: 100%
                      brightness: 60%
                      effect: none
          else:
            - light.turn_off: status_led

  - id: start_wake_word
    then:
      - if:
          condition:
            and:
              - not:
                  voice_assistant.is_running:
              - lambda: 'return id(wake_word_engine).current_option() == "On device";'
          then:
            - lambda: 'id(va).set_use_wake_word(false);'
            - micro_wake_word.start:
      - if:
          condition:
            and:
              - not:
                  voice_assistant.is_running:
              - lambda: 'return id(wake_word_engine).current_option() == "In Home Assistant";'
          then:
            - lambda: 'id(va).set_use_wake_word(true);'
            - voice_assistant.start_continuous:

  - id: stop_wake_word
    then:
      - if:
          condition:
            lambda: 'return id(wake_word_engine).current_option() == "In Home Assistant";'
          then:
            - lambda: 'id(va).set_use_wake_word(false);'
            - voice_assistant.stop:
      - if:
          condition:
            lambda: 'return id(wake_word_engine).current_option() == "On device";'
          then:
            - micro_wake_word.stop:

voice_assistant:
  id: va
  microphone:
    microphone: echo_microphone
    gain_factor: 4
  micro_wake_word: mww
  use_wake_word: false
  media_player: tts_media_player
  noise_suppression_level: 2
  auto_gain: 31dBFS
  volume_multiplier: 4.0
  conversation_timeout: 40s

  on_listening:
    - light.turn_on:
        id: status_led
        blue: 100%
        red: 0%
        green: 0%
        effect: "Slow Pulse"

  on_stt_vad_end:
    - light.turn_on:
        id: status_led
        blue: 100%
        red: 0%
        green: 0%
        effect: "Fast Pulse"

  on_tts_start:
    - light.turn_on:
        id: status_led
        blue: 100%
        red: 0%
        green: 0%
        brightness: 100%
        effect: none

  on_end:
    # Wait for announcement to start (handles "nevermind" case where there is none)
    - wait_until:
        condition:
          media_player.is_announcing:
            id: tts_media_player
        timeout: 0.5s
    # In on-device MWW mode, wait for playback to finish before restarting
    - if:
        condition:
          lambda: 'return id(wake_word_engine).current_option() == "On device";'
        then:
          - wait_until:
              condition:
                and:
                  - not:
                      voice_assistant.is_running:
                  - not:
                      speaker.is_playing:
                        id: i2s_speaker
              timeout: 30s
          - lambda: 'id(va).set_use_wake_word(false);'
          - micro_wake_word.start:
    - script.execute: reset_led

  on_error:
    - light.turn_on:
        id: status_led
        red: 100%
        green: 0%
        blue: 0%
        brightness: 100%
        effect: none
    - delay: 2s
    - script.execute: reset_led
    - script.execute: start_wake_word

  on_client_connected:
    - delay: 2s
    - script.execute: start_wake_word

  on_client_disconnected:
    - script.execute: stop_wake_word
