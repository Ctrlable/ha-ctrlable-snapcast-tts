# M5Stack CoreS3 — Living Room satellite
#
# `name` IS the satellite_id sent to the add-on, so it must match the mapping
# registered at POST /mappings. Change one without the other and every announce
# comes back 404 "Satellite has no mapping".
substitutions:
  name: cores3-va-e39e44
  friendly_name: "Ctrlable Living Room CoreS3"
  micro_wake_word_model: okay_nabu

packages:
  ctrlable_base: !include ../ctrlable_cores3_snapcast.yaml
