# Ctrlable reference satellite base package — Atom Echo variant
# Substitutions expected from the including file:
#   name: kebab-case device name (becomes the satellite_id)
#   friendly_name: human-readable name
#   micro_wake_word_model: built-in or custom model name

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  min_version: "2025.5.0"

esp32:
  board: m5stack-atom
  cpu_frequency: 240MHz
  framework:
    type: esp-idf

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: NONE
  ap:
    ssid: "${friendly_name} Fb"

captive_portal:

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome

logger:

globals:
  - id: last_tts_url
    type: std::string
    restore_value: false
    initial_value: '""'
  - id: current_wake_word
    type: std::string
    restore_value: false
    initial_value: '""'

i2s_audio:
  - id: i2s_audio_bus
    i2s_lrclk_pin: GPIO33
    i2s_bclk_pin: GPIO19

microphone:
  - platform: i2s_audio
    id: echo_microphone
    i2s_audio_id: i2s_audio_bus
    i2s_din_pin: GPIO23
    adc_type: external
    pdm: true
    sample_rate: 16000
    correct_dc_offset: true

speaker:
  - platform: i2s_audio
    id: dummy_speaker
    i2s_audio_id: i2s_audio_bus
    i2s_dout_pin: GPIO22
    dac_type: external
    bits_per_sample: 16bit
    sample_rate: 16000
    channel: mono

media_player:
  - platform: speaker
    id: tts_media_player
    name: "TTS Output"
    internal: true
    announcement_pipeline:
      speaker: dummy_speaker
      format: MP3

micro_wake_word:
  id: mww
  vad:
  models:
    - model: ${micro_wake_word_model}
      id: wake_model
  on_wake_word_detected:
    - lambda: 'id(current_wake_word) = wake_word;'
    - voice_assistant.start:
        wake_word: !lambda return wake_word;

switch:
  - platform: template
    id: mute_switch
    name: "Mute"
    icon: "mdi:microphone-off"
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    on_turn_on:
      - micro_wake_word.stop:
      - light.turn_on:
          id: status_led
          red: 100%
          green: 0%
          blue: 0%
          brightness: 30%
    on_turn_off:
      - light.turn_off: status_led
      - micro_wake_word.start:
  - platform: template
    id: local_speaker_switch
    name: "Use local speaker"
    icon: "mdi:speaker"
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF

light:
  - platform: esp32_rmt_led_strip
    id: status_led
    name: "Status LED"
    internal: true
    rgb_order: GRB
    pin: GPIO27
    num_leds: 1
    chipset: SK6812

binary_sensor:
  - platform: gpio
    pin:
      number: GPIO39
      inverted: true
    name: "Wake button"
    on_press:
      - if:
          condition:
            switch.is_off: mute_switch
          then:
            - micro_wake_word.stop:
            - voice_assistant.start:

voice_assistant:
  id: va
  microphone:
    microphone: echo_microphone
    gain_factor: 4
  micro_wake_word: mww
  use_wake_word: false
  media_player: tts_media_player
  noise_suppression_level: 2
  auto_gain: 31dBFS
  volume_multiplier: 4.0
  conversation_timeout: 40s

  on_intent_progress:
    - if:
        condition:
          lambda: 'return !x.empty();'
        then:
          - if:
              condition:
                switch.is_off: local_speaker_switch
              then:
                - lambda: 'id(last_tts_url) = x;'
                - media_player.stop:
                    id: tts_media_player
                - homeassistant.service:
                    service: ctrlable_snapcast_tts.announce
                    data:
                      url: !lambda 'return x;'
                      satellite_id: "${name}"
                      wake_word: !lambda 'return id(current_wake_word);'

  on_tts_end:
    - if:
        condition:
          switch.is_off: local_speaker_switch
        then:
          # Stop local playback immediately — Snapcast handles all audio output.
          # Without this the voice_assistant auto-plays the MP3 over HTTPS/TLS,
          # which competes with micro_wake_word for heap and causes ESP_ERR_NO_MEM.
          - media_player.stop:
              id: tts_media_player
          - if:
              condition:
                lambda: 'return !x.empty() && x != id(last_tts_url);'
              then:
                - lambda: 'id(last_tts_url) = x;'
                - homeassistant.service:
                    service: ctrlable_snapcast_tts.announce
                    data:
                      url: !lambda 'return x;'
                      satellite_id: "${name}"
                      wake_word: !lambda 'return id(current_wake_word);'

  on_listening:
    - light.turn_on:
        id: status_led
        red: 0%
        green: 0%
        blue: 100%
        brightness: 80%

  on_intent_start:
    - light.turn_on:
        id: status_led
        red: 100%
        green: 60%
        blue: 0%
        brightness: 80%

  on_end:
    - lambda: 'id(last_tts_url) = "";'
    - lambda: 'id(current_wake_word) = "";'
    - light.turn_on:
        id: status_led
        red: 0%
        green: 100%
        blue: 0%
        brightness: 40%
    # Wait for any in-progress announcement to finish before restarting wake
    # word detection. A fixed delay is not enough — on_end fires when the HA
    # pipeline ends, not when local or Snapcast playback is done. Starting
    # micro_wake_word while the media pipeline holds TLS/heap memory causes
    # ESP_ERR_NO_MEM and a 70-second deaf loop.
    - wait_until:
        condition:
          not:
            media_player.is_announcing:
              id: tts_media_player
        timeout: 30s
    - delay: 200ms
    - light.turn_off: status_led
    - if:
        condition:
          switch.is_off: mute_switch
        then:
          - micro_wake_word.start:

  on_error:
    - lambda: 'id(last_tts_url) = "";'
    - lambda: 'id(current_wake_word) = "";'
    - light.turn_on:
        id: status_led
        red: 100%
        green: 0%
        blue: 0%
        brightness: 80%
    - delay: 2s
    - light.turn_off: status_led
    - if:
        condition:
          switch.is_off: mute_switch
        then:
          - micro_wake_word.start:

  on_client_connected:
    - if:
        condition:
          switch.is_off: mute_switch
        then:
          - micro_wake_word.start:

  on_client_disconnected:
    - micro_wake_word.stop:
    - voice_assistant.stop:
