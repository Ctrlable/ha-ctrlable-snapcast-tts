# --- Ctrlable: stream the mic to the server over RTP ------------------------
#
# Optional package. Include it from a satellite that has `i2s_mics`:
#
#   packages:
#     rtp_mic: !include packages/ctrlable_rtp_mic.yaml
#
# WHY. This device answers through the Snapcast TTS add-on: the reply plays
# from the room's speakers, which this XVF3800 never hears as a reference, so
# its own echo canceller has nothing to subtract. The server does know what
# the room plays -- every zone's mix -- so with the mic there too, PipeWire's
# echo canceller can do the job. Nothing about how the device answers changes.
#
# A SERVICE, NOT A SETTING. The device never knows the server. It listens on
# tcp/6055; the hardware manager ("Add network mic", by IP or from the mDNS
# record below) connects and asks for the stream, and the RTP goes back to the
# address that asked, for as long as that connection stays open and keeps
# talking (30 s idle timeout). Nothing to type on the device, no server IP in
# this file, and the manager needs no ESPHome API key. One server at a time:
# a second one is refused and told who holds the mic.
#
# TOKEN. Set `rtp_mic_token` in the device's own substitutions to require
# `token=<it>` on every request. Empty (the default) means anyone on the LAN
# who can reach tcp/6055 can listen to this room -- the same trust the house
# already gives to its other unauthenticated LAN audio (snapcast, RTP). Set a
# token if the LAN carries guests or untrusted devices; it is sent in clear
# text, so it keeps out the curious, not someone sniffing the network.
#
# WAKE WORD. On the XVF3800 the service runs only in "Mic only" mode, where the
# device's own wake word is stopped and a server assistant (LVA, created in the
# hardware manager on this mic) listens instead -- and drives the LED ring back
# through `LED <state>` on the same control connection.
#
# BEAM. formatBCE's int-host 48k firmware puts the XVF3800's outputs on two
# I2S slots, read here as two channels. This config already gives
# voice_assistant (speech-to-text) channel 0 and micro_wake_word channel 1,
# matching Seeed's table for its 48 kHz Home Assistant build: channel 0 = ASR
# beam, channel 1 = wake-word output. The manager picks the beam per session
# (`beam=asr|wakeword`), so a wrong guess here is a manager setting, not a
# reflash.
#
# ECHO REFERENCE. The manager may offer the room's mix back (`ref=<ms>` on
# START); a device whose config wires `rtp_mic: reference:` takes it on udp/6056
# and plays it, silently, into the XVF3800's echo-reference input. Measured
# 2026-10-10 with music: 0 dB -- it reaches the XVF later than the echo -- so
# the XVF3800 satellite no longer wires it. Server-side
# cancelling of the XVF's output does not work (measured 2026-10-10: 0.0-0.3
# dB) because that output is already non-linearly processed; the canceller has
# to be the XVF's own. Declined while the device plays its answers itself.

substitutions:
  rtp_mic_token: ""

rtp_mic:
  id: rtp
  microphone:
    microphone: i2s_mics
    channels: [0, 1]
    bits_per_sample: 32
  control_port: 6055
  token: ${rtp_mic_token}
  # Mic-only mode: the server assistant's state, relayed by the hardware
  # manager from LVA's peripheral API. Mapped onto the phases the device's own
  # LED scripts already draw, so the ring looks the same either way.
  on_led:
    - lambda: |-
        int phase;
        if (x == "idle") phase = ${voice_assist_idle_phase_id};
        else if (x == "wake") phase = ${voice_assist_waiting_for_command_phase_id};
        else if (x == "listening") phase = ${voice_assist_listening_for_command_phase_id};
        else if (x == "thinking") phase = ${voice_assist_thinking_phase_id};
        else if (x == "speaking") phase = ${voice_assist_replying_phase_id};
        else if (x == "error") phase = ${voice_assist_error_phase_id};
        else if (x == "disconnected") phase = ${voice_assist_not_ready_phase_id};
        else {
          ESP_LOGW("rtp_mic", "unknown LED state '%s'", x.c_str());
          return;
        }
        if (id(mode_index) != 2)
          return;  // only Mic only hands the ring to the server
        id(voice_assistant_phase) = phase;
        id(control_leds).execute();

# Lets the manager list RTP-capable satellites without anyone typing an IP.
mdns:
  services:
    - service: "_ctrlable-rtp-mic"
      protocol: "_tcp"
      port: 6055
      txt:
        format: L16/16000/1
        control: tcp-line/1
        beams: asr,wakeword
        led: "1"

switch:
  # Off refuses new sessions and hangs up on the current one at once. Set by
  # the device's "Device mode" (on only in Mic only), hence internal; a satellite
  # without a mode select can make it visible and restore it instead.
  - platform: template
    name: "RTP mic service"
    id: rtp_service
    internal: true
    optimistic: true
    restore_mode: ALWAYS_OFF
    on_turn_on:
      - lambda: id(rtp).set_service_enabled(true);
    on_turn_off:
      - lambda: id(rtp).set_service_enabled(false);

text_sensor:
  # Who is listening right now: "10.1.8.174:46000 (asr)", or empty. The answer
  # to "is this room's mic being streamed, and to where?" on the device itself.
  - platform: template
    name: "RTP mic client"
    id: rtp_client
    icon: mdi:ip-network
    entity_category: diagnostic
    update_interval: 5s
    lambda: return id(rtp).get_client();

esphome:
  on_boot:
    # A restored switch does not always replay its trigger at boot.
    - priority: -100
      then:
        - lambda: id(rtp).set_service_enabled(id(rtp_service).state);

external_components:
  - source:
      type: local
      # Resolved from the MAIN config file's directory, not this package's.
      path: components
    components: [rtp_mic]
