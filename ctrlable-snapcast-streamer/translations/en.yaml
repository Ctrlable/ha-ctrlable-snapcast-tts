configuration:
  snapcast_host:
    name: Snapcast Host
    description: IP address or hostname of your Snapcast server.
  snapcast_rpc_port:
    name: Snapcast RPC Port
    description: JSON-RPC TCP port on the main Snapcast server (default 1705). Used for client and group discovery.
  snapcast_announcement_rpc_port:
    name: Announcement Server RPC Port
    description: JSON-RPC TCP port on the announcement Snapcast instance (default 1715). Used for managing announcement streams.
  announce_port_base:
    name: Announcement Port Base
    description: First TCP port used for announcement streams. Each enabled client uses one port starting from this value.
  config_mode:
    name: Config Mode
    description: "file_edit: add-on auto-updates snapserver.conf via SSH. rpc_only: generates snippet for manual copy."
  log_level:
    name: Log Level
    description: Verbosity of add-on logs.
