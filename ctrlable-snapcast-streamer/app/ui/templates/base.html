<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ctrlable Snapcast TTS</title>
  <style>
    :root {
      --bg: #1c1c1e; --surface: #2c2c2e; --border: #3a3a3c;
      --accent: #0a84ff; --text: #f2f2f7; --muted: #8e8e93;
      --success: #30d158; --warn: #ffd60a; --error: #ff453a;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
           background: var(--bg); color: var(--text); font-size: 14px; }
    header { background: var(--surface); border-bottom: 1px solid var(--border);
             padding: 12px 20px; display: flex; align-items: center; gap: 12px; }
    header h1 { font-size: 16px; font-weight: 600; }
    header .badge { font-size: 11px; background: var(--border); color: var(--muted);
                    padding: 2px 8px; border-radius: 10px; }
    nav { display: flex; gap: 2px; padding: 12px 20px 0; border-bottom: 1px solid var(--border); }
    nav a { padding: 8px 14px; text-decoration: none; color: var(--muted); border-radius: 6px 6px 0 0;
            border: 1px solid transparent; border-bottom: none; font-size: 13px; }
    nav a:hover { color: var(--text); background: var(--surface); }
    nav a.active { color: var(--text); background: var(--surface);
                   border-color: var(--border); border-bottom-color: var(--surface); }
    main { padding: 24px 20px; max-width: 1000px; }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
            padding: 20px; margin-bottom: 16px; }
    .card h2 { font-size: 14px; font-weight: 600; margin-bottom: 16px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
    label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 4px; margin-top: 12px; }
    input[type=text], input[type=number], input[type=password], select {
      width: 100%; padding: 8px 10px; background: var(--bg); border: 1px solid var(--border);
      border-radius: 6px; color: var(--text); font-size: 13px; }
    input:focus, select:focus { outline: none; border-color: var(--accent); }
    button { padding: 8px 16px; border: none; border-radius: 6px; font-size: 13px;
             cursor: pointer; font-weight: 500; }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-primary:hover { opacity: .9; }
    .btn-secondary { background: var(--border); color: var(--text); }
    .btn-sm { padding: 4px 10px; font-size: 12px; }
    .status-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
    .dot-green { background: var(--success); }
    .dot-red { background: var(--error); }
    .dot-yellow { background: var(--warn); }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th { text-align: left; padding: 8px 10px; color: var(--muted); font-size: 11px;
         text-transform: uppercase; letter-spacing: .05em; border-bottom: 1px solid var(--border); }
    td { padding: 10px; border-bottom: 1px solid var(--border); }
    tr:last-child td { border-bottom: none; }
    .mono { font-family: monospace; font-size: 12px; }
    .alert { padding: 10px 14px; border-radius: 6px; font-size: 13px; margin-bottom: 16px; }
    .alert-error { background: #3a1a1a; border: 1px solid var(--error); color: #ff8080; }
    .alert-warn  { background: #2e2a10; border: 1px solid var(--warn); color: #ffd060; }
    .alert-ok    { background: #0d2e1a; border: 1px solid var(--success); color: #60e090; }
    .toggle { position: relative; display: inline-block; width: 36px; height: 20px; }
    .toggle input { opacity: 0; width: 0; height: 0; }
    .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0;
              background: var(--border); border-radius: 20px; transition: .2s; }
    .slider:before { position: absolute; content: ""; height: 14px; width: 14px; left: 3px;
                     bottom: 3px; background: white; border-radius: 50%; transition: .2s; }
    input:checked + .slider { background: var(--accent); }
    input:checked + .slider:before { transform: translateX(16px); }
  </style>
</head>
<body>
  <header>
    <span style="font-size:20px">🔊</span>
    <h1>Ctrlable Snapcast TTS</h1>
    <span class="badge">{% block version %}v{{ version }}{% endblock %}</span>
    {% if degraded %}
    <span class="badge" style="background:#3a1a1a;color:#ff8080">⚠ degraded</span>
    {% endif %}
  </header>
  <nav>
    <a href="{{ ingress_path }}/ui/" {% if active == 'connection' %}class="active"{% endif %}>Connection</a>
    <a href="{{ ingress_path }}/ui/clients" {% if active == 'clients' %}class="active"{% endif %}>Clients</a>
    <a href="{{ ingress_path }}/ui/streams" {% if active == 'streams' %}class="active"{% endif %}>Streams</a>
    <a href="{{ ingress_path }}/ui/mappings" {% if active == 'mappings' %}class="active"{% endif %}>Mappings</a>
    <a href="{{ ingress_path }}/ui/activity" {% if active == 'activity' %}class="active"{% endif %}>Activity</a>
    <a href="{{ ingress_path }}/ui/advanced" {% if active == 'advanced' %}class="active"{% endif %}>Advanced</a>
  </nav>
  <main>
    {% block content %}{% endblock %}
  </main>
  <script>
    if (location.pathname.startsWith('{{ ingress_path }}/ui/activity')) {
      setTimeout(() => location.reload(), 10000);
    }
  </script>
</body>
</html>
