slug: ctrlable_snapcast_streamer
name: Ctrlable Snapcast TTS Streamer
version: "0.0.1"
description: Stream Home Assistant Assist TTS responses to specific Snapcast clients with low-latency, UI-configurable routing.
url: https://github.com/Ctrlable/ha-ctrlable-snapcast-tts
arch:
  - aarch64
  - amd64
  - armv7
init: false
ingress: true
ingress_port: 8099
panel_icon: mdi:speaker-wireless
panel_title: Snapcast TTS
homeassistant_api: true
ports:
  8765/tcp: 8765
ports_description:
  8765/tcp: TTS announcement API (for integration and legacy REST callers)
map:
  - ssl
  - share
options:
  snapcast_host: "10.1.8.9"
  snapcast_rpc_port: 1705
  announce_port_base: 4963
  config_mode: "file_edit"
  log_level: "info"
schema:
  snapcast_host: str
  snapcast_rpc_port: port
  announce_port_base: port
  config_mode: "list(file_edit|rpc_only)"
  log_level: "list(debug|info|warning|error)"
